openapi: 3.1.0
info:
  title: ConstructERP Platform API
  version: 1.0.0
  description: |
    Shared platform foundation services for the ConstructERP ecosystem.
    All APIs follow standard conventions: JSON responses, pagination, filtering,
    sorting, request IDs, and structured error format.
  contact:
    name: ConstructERP Team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }
            hasNext: { type: boolean }
            hasPrev: { type: boolean }

    Company:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        legalName: { type: string }
        gstin: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        country: { type: string }
        financialYearStart:
          type: object
          properties:
            month: { type: integer }
            day: { type: integer }
        currency: { type: string, default: INR }
        timezone: { type: string, default: Asia/Kolkata }

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [planned, active, on_hold, completed, cancelled]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role:
          type: string
          enum:
            - super_admin
            - company_admin
            - project_manager
            - site_manager
            - plant_manager
            - site_engineer
            - operator
            - fuel_officer
            - store_keeper
            - accounts_manager
            - accounts_executive
            - qa_engineer
            - maintenance_manager
            - viewer

    AuditRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string }
        action:
          type: string
          enum: [create, update, delete, submit, approve, reject, return, post, reverse, amend, escalate, delegate, withdraw, assign, acknowledge, resolve, close, export, login, logout, permission_change]
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        actorId: { type: string }
        actorRole: { type: string }
        reason: { type: string }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }

    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        severity:
          type: string
          enum: [info, warning, high, critical]
        title: { type: string }
        description: { type: string }
        module: { type: string }
        status:
          type: string
          enum: [open, acknowledged, assigned, escalated, resolved, closed]
        createdAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        recommendedAction: { type: string }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string }
        category:
          type: string
          enum: [hour_meter, odometer, fuel_meter, registration_plate, damage, delivery_receipt, slump_test, cube_test, work_completion, signature, invoice, general]
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        uploadedAt: { type: string, format: date-time }

    NumberSeries:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentType: { type: string }
        prefix: { type: string }
        financialYear: { type: string, example: '2026-27' }
        lastNumber: { type: integer }
        paddingLength: { type: integer }

  parameters:
    pageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    pageSizeParam:
      name: pageSize
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    sortParam:
      name: sort
      in: query
      schema: { type: string }
      description: 'Comma-separated fields with optional - prefix for desc. E.g., -createdAt,name'
    searchParam:
      name: search
      in: query
      schema: { type: string }

paths:
  /companies:
    get:
      summary: List companies
      tags: [Masters]
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Paginated list of companies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
    post:
      summary: Create company
      tags: [Masters]
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'

  /projects:
    get:
      summary: List projects
      tags: [Masters]
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
        - $ref: '#/components/parameters/searchParam'
      responses:
        '200':
          description: Paginated list of projects

  /audit:
    get:
      summary: Search audit records
      tags: [Audit]
      parameters:
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: actorId
          in: query
          schema: { type: string }
        - name: fromDate
          in: query
          schema: { type: string, format: date }
        - name: toDate
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Paginated audit records

  /attachments:
    post:
      summary: Upload attachment
      tags: [Attachments]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                entityType: { type: string }
                entityId: { type: string }
                category: { type: string }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  /attachments/{id}/download:
    get:
      summary: Download attachment (signed URL)
      tags: [Attachments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: File content
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /numbering/generate:
    post:
      summary: Generate next document number
      tags: [Numbering]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [documentType]
              properties:
                documentType: { type: string }
                plantId: { type: string }
                siteId: { type: string }
      responses:
        '200':
          description: Generated number
          content:
            application/json:
              schema:
                type: object
                properties:
                  number: { type: string, example: 'OL/2026-27/0001' }

  /workflow/{entityType}/{entityId}/actions:
    get:
      summary: Get available workflow actions
      tags: [Workflow]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Available actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { type: string }

  /workflow/{entityType}/{entityId}/execute:
    post:
      summary: Execute workflow action
      tags: [Workflow]
      parameters:
        - name: entityType
          in: path
          required: true
          schema: { type: string }
        - name: entityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, approve, reject, return, request_evidence, escalate, withdraw, post, reverse, cancel, comment]
                reason: { type: string }
                comment: { type: string }
      responses:
        '200':
          description: Workflow state updated
        '403':
          description: Separation of duties violation
        '422':
          description: Invalid transition

  /alerts:
    get:
      summary: List alerts
      tags: [Alerts]
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, high, critical] }
        - name: status
          in: query
          schema: { type: string, enum: [open, acknowledged, assigned, escalated, resolved, closed] }
        - name: module
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/pageSizeParam'
      responses:
        '200':
          description: Paginated alerts

  /alerts/{id}/acknowledge:
    post:
      summary: Acknowledge alert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Alert acknowledged

  /alerts/{id}/resolve:
    post:
      summary: Resolve alert
      tags: [Alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resolutionNote]
              properties:
                resolutionNote: { type: string }
      responses:
        '200':
          description: Alert resolved

  /notifications/me:
    get:
      summary: Get current user notifications
      tags: [Notifications]
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: User notifications

tags:
  - name: Masters
    description: Organizational hierarchy and shared masters
  - name: Audit
    description: Audit trail (read-only)
  - name: Attachments
    description: File upload and evidence management
  - name: Numbering
    description: Document number generation
  - name: Workflow
    description: Workflow and approval engine
  - name: Alerts
    description: Alert management
  - name: Notifications
    description: User notifications
